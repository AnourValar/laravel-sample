    journal_heavy:
      $ref: schemas/journal_heavy.yaml

  requestBodies:
    confirm_email:
      $ref: requestBodies/confirm_email.yaml
    confirm_phone:
      $ref: requestBodies/confirm_phone.yaml
    confirm_pow:
      $ref: requestBodies/confirm_pow.yaml
    per_page:
      $ref: requestBodies/per_page.yaml
    page:
      $ref: requestBodies/page.yaml
    cursor:
      $ref: requestBodies/cursor.yaml

    filter_created_at:
      $ref: requestBodies/filter_created_at.yaml
    filter_deleted_at:
      $ref: requestBodies/filter_deleted_at.yaml
    filter_id:
      $ref: requestBodies/filter_id.yaml
    filter_search:
      $ref: requestBodies/filter_search.yaml
    relation_fileVirtuals:
      $ref: requestBodies/relation_fileVirtuals.yaml
    sort_id:
      $ref: requestBodies/sort_id.yaml
    sort_deleted_at:
      $ref: requestBodies/sort_deleted_at.yaml

  responses:
    id:
      $ref: responses/id.yaml
    paginate:
      $ref: responses/paginate.yaml
    simple_paginate:
      $ref: responses/simple_paginate.yaml
    cursor_paginate:
      $ref: responses/cursor_paginate.yaml

    400:
      $ref: responses/400.yaml
    401:
      $ref: responses/401.yaml
    403:
      $ref: responses/403.yaml
    404:
      $ref: responses/404.yaml
    405:
      $ref: responses/405.yaml
    422:
      $ref: responses/422.yaml
    429:
      $ref: responses/429.yaml

  examples:
    paginate_empty:
      $ref: examples/paginate_empty.yaml
    simple_paginate_empty:
      $ref: examples/simple_paginate_empty.yaml
    cursor_paginate_empty:
      $ref: examples/cursor_paginate_empty.yaml

  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: Токен пользователя
    Token:
      type: apiKey
      in: header
      name: Authorization
      description: Токен сервера

