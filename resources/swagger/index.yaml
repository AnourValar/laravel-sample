openapi: 3.1.0
info:
  title: laravel-sample API
  description: |
    * **Обязательные заголовки** и **ответы с ошибками** описаны только в группе \"Все запросы\", т.к. они идентичны для всех веб-сервисов;
    * **Токен** не имеет срока жизни, но в любой момент может быть отозван вручную;
    * **Все datetime** поля в response представлены в формате ISO-8601 (UTC). В request даты могут отправляться в любом формате, но в часовом поясе UTC.
    * Справочник virtual_file.name (по entity):
      * field: attachment [зависит от field.name]
      * ticket: attachment_request, attachment_response

  version: 0.1.0

servers:
  - url: http://laravel-sample.loc/api
    description: Sandbox

tags:
  - name: "*"
    description: Все запросы
  - name: Auth
    description: Аутентификация
  - name: User
    description: Пользователь
  - name: Notification
    description: Уведомление ЛК
  - name: Directory
    description: Справочник
  - name: Field
    description: Поля
  - name: Analytics
    description: Аналитика
  - name: File
    description: Файлы
  - name: Ticket
    description: Тикет
  - name: Journal
    description: Журнал (логирование)

