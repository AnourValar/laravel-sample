    - name: "Accept-Language"
      in: "header"
      description: "Язык (локаль)"
      required: false
      schema:
        type: "string"
        enum:
          - "ru"
          - "en"

    - name: "X-Timezone"
      in: "header"
      description: "Часовой пояс клиента"
      required: false
      schema:
        type: "string"
        example: "Europe/Moscow"

    - name: "Authorization"
      in: "header"
      description: "Токен пользователя (аутентификация)"
      required: false
      schema:
        type: "string"
        example: "Bearer <token>"

