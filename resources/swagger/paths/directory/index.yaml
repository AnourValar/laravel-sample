post:
  tags:
    - Directory
  summary: "Список справочников"
  description: "ACL: guest - общие, cabinet - собственные & общие, cabinet.directory.read - все"
  security:
    - Bearer: []
    - {}

#  parameters:

  requestBody:
    content:
      application/json:
        schema:
          allOf:
            - $ref: "../../index.yaml#/components/requestBodies/page"
            - $ref: "../../index.yaml#/components/requestBodies/per_page"
            - $ref: "../../index.yaml#/components/requestBodies/filter_search"
            - $ref: "../../index.yaml#/components/requestBodies/sort_id"
            - type: "object"
              properties:
                filter:
                  description: "Фильтры"
                  type: "object"
                  properties:
                    type:
                      description: 'Поле "Тип"'
                      type: "object"
                      properties:
                        "in":
                          description: 'Операция "входит в список"'
                          type: "array"
                          items:
                            type: "string"
                            example: "user_tag"
                    user_id:
                      description: 'Поле "Пользователь"'
                      type: "object"
                      properties:
                        "in":
                          description: 'Операция "входит в список"'
                          type: "array"
                          items:
                            type: "integer"
                            example: 10000

        examples:
          default:
            summary: "Все параметры"
          empty:
            summary: "Без параметров"
            value: "[]"

  responses:
    200:
      description: "Успешный запрос"
      content:
        application/json:
          schema:
            allOf:
              - type: "object"
                properties:
                  data:
                    type: "array"
                    description: "Список"
                    items:
                      allOf:
                        - $ref: "../../index.yaml#/components/schemas/directory_light"
              - $ref: "../../index.yaml#/components/responses/simple_paginate"
          examples:
            default:
              summary: "Список с результатами"
            empty:
              $ref: "../../index.yaml#/components/examples/simple_paginate_empty"
