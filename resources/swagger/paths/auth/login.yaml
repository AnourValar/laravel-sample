post:
  tags:
    - Auth
  summary: "Аутентификация (получение токена пользователя)"
  description: "FA: 2 [если у пользователя >= 3 факторов] или 1 [иначе] [кроме session]"
#  security:
#    - Bearer: []

#  parameters:

  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - type: "object"
              properties:
                cryptograms_fa:
                  description: "Криптограммы факторов (см. /auth/fa/*)"
                  example:
                    - "eyJpdiI6ImRNM3F6K2R1ZzRVODJtbmlOY2tBUFE9<...>GNhZTk2NzkzOTEyNGU0ZWZkODRmZGZhY2ZiZmE3OSIsInRhZyI6IiJ9"
                    - "eyJpdiI6IkF4TGNrbDdNNy9TRU9qSHBKUUFJQm9P<...>HVlIjoiZXhVM09hMnJheXRXeCt2UTFBNEM0Zz09IiwibWFjIjoiIiJ9"
                device:
                  description: "Название устройства"
                  type: "string"
                  example: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
            - required:
              - "cryptograms_fa"
              - "device"

  responses:
    200:
      description: "Успешный запрос"
      content:
        application/json:
          schema:
            allOf:
              - type: "object"
                properties:
                  token:
                    description: "Токен"
                    type: "string"
                    example: "1|fubkj3U11MGbvBqDX4GipixctHg8QLlPmOJ4oyAm"
