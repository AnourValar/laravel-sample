post:
  tags:
    - Auth
  summary: "Изменение пароля"
  description: "FA: 2"
#  security:
#    - Bearer: []

#  parameters:

  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - type: "object"
              properties:
                cryptograms_fa:
                  description: "Криптограммы факторов (см. /auth/fa/*)"
                  example:
                    - "eyJpdiI6ImRNM3F6K2R1ZzRVODJtbmlOY2tBUFE9<...>GNhZTk2NzkzOTEyNGU0ZWZkODRmZGZhY2ZiZmE3OSIsInRhZyI6IiJ9"
                    - "eyJpdiI6IkF4TGNrbDdNNy9TRU9qSHBKUUFJQm9P<...>HVlIjoiZXhVM09hMnJheXRXeCt2UTFBNEM0Zz09IiwibWFjIjoiIiJ9"
                password:
                  description: "Пароль"
                  type: "string"
                  example: "password"
            - required:
              - "cryptograms_fa"
              - "password"

  responses:
    200:
      description: "Успешный запрос"
      content:
        application/json:
          schema:
            allOf:
              - type: "object"
                properties:
                  user:
                    $ref: "../../index.yaml#/components/responses/id"
