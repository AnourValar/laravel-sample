post:
  tags:
    - Auth
  summary: "FA: подтверждение TOTP"
  description: ""
#  security:
#    - Bearer: []

#  parameters:

  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - type: "object"
              properties:
                login:
                  description: "Телефон или email"
                  type: "string"
                  example: "79001234567"
                code_totp:
                  description: "Код TOTP"
                  type: "string"
                  example: "123456"
            - required:
              - "login"
              - "code_totp"

  responses:
    200:
      description: "Успешный запрос"
      content:
        application/json:
          schema:
            allOf:
              - type: "object"
                properties:
                  cryptogram_fa:
                    description: "Криптограмма фактора"
                    type: "string"
                    example: "eyJpdiI6ImJneTA3bGtTQTFEYnMvV<...>zBhNSIsInRhZyI6IiJ9"
                  factors:
                    $ref: "../../index.yaml#/components/schemas/user_factors"
