post:
  tags:
    - Auth
  summary: "Регистрация пользователя (получение токена)"
  description: "FA: 1 [кроме session]"
#  security:
#    - Bearer: []

#  parameters:

  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - type: "object"
              properties:
                cryptograms_fa:
                  description: "Криптограммы факторов (см. /auth/fa/*)"
                  example:
                    - "eyJpdiI6ImRNM3F6K2R1ZzRVODJtbmlOY2tBUFE9<...>GNhZTk2NzkzOTEyNGU0ZWZkODRmZGZhY2ZiZmE3OSIsInRhZyI6IiJ9"
                device:
                  description: "Название устройства"
                  type: "string"
                  example: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
                password:
                  description: "Пароль"
                  type: "string"
                  example: "password"
                first_name:
                  description: "Имя"
                  type:
                    - "string"
                    - "null"
                  example: "Иван"
                role:
                  description: "Роль"
                  type: "string"
                  example: "client"
            - required:
              - "cryptograms_fa"
              - "device"
              - "password"
              - "role"

  responses:
    200:
      description: "Успешный запрос"
      content:
        application/json:
          schema:
            allOf:
              - type: "object"
                properties:
                  token:
                    description: "Токен"
                    type: "string"
                    example: "1|fubkj3U11MGbvBqDX4GipixctHg8QLlPmOJ4oyAm"
