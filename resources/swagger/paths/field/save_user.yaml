post:
  tags:
    - Field
  summary: "Изменение поля"
  description: "ACL: cabinet - собственные"
  security:
    - Bearer: []

  parameters:
    - name: "name"
      in: "path"
      description: "Техн. название (идентификатор) поля"
      example: "profile_form"
      required: true
    - name: "user_id"
      in: "path"
      description: "ID (пользователь)"
      example: "10000"
      required: true

  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - type: "object"
              properties:
                field:
                  allOf:
                    - $ref: "../../index.yaml#/components/schemas/field_light"
                    - properties:
                        status:
                          readOnly: true
            - required:
              - "field"

  responses:
    200:
      description: "Успешный запрос"
      content:
        application/json:
          schema:
            allOf:
              - type: "object"
                properties:
                  field:
                    $ref: "../../index.yaml#/components/responses/id"
