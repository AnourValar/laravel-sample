post:
  tags:
    - User
  summary: "Удаление всех wildcard-токенов (кроме представленного) (текущий пользователь)"
  description: "ACL: cabinet - собственные"
  security:
    - Bearer: []

  parameters:
    - name: "token_id"
      in: "path"
      description: "ID (токен)"
      example: "1"
      required: true

#  requestBody:

  responses:
    200:
      description: "Успешный запрос"
      content:
        application/json:
          schema:
            allOf:
              - type: "object"
                properties:
                  user_token:
                    type: "object"
                    properties:
                      ids:
                        type: "array"
                        items:
                          type: "integer"
                          example: 2
