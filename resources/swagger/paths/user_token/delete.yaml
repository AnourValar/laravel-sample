post:
  tags:
    - User
  summary: "Удаление токена (текущий пользователь)"
  description: "ACL: cabinet - собственные"
  security:
    - Bearer: []

  parameters:
    - name: "token_id"
      in: "path"
      description: "ID токена"
      example: "1"
      required: true

#  requestBody:

  responses:
    200:
      description: "Успешный запрос"
      content:
        application/json:
          schema:
            allOf:
              - type: "object"
                properties:
                  user_token:
                    $ref: "../../index.yaml#/components/responses/id"
