post:
  tags:
    - User
  summary: "Изменение TOTP-сессии (текущий пользователь)"
  description: "ACL: cabinet - собственный профиль | FA: 1 [кроме session]"
  security:
    - Bearer: []

#  parameters:

  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - type: "object"
              properties:
                cryptograms_fa:
                  description: "Криптограммы факторов (см. /auth/fa/*)"
                  example:
                    - "eyJpdiI6ImRNM3F6K2R1ZzRVODJtbmlOY2tBUFE9<...>GNhZTk2NzkzOTEyNGU0ZWZkODRmZGZhY2ZiZmE3OSIsInRhZyI6IiJ9"
                cryptogram_new_totp:
                  description: "Криптограмма новой TOTP-сессии (см. /user/totp/generate)"
                  type: "string"
                  example: "eyJpdiI6ImJneTA3bGtTQTFEYnMvV<...>zBhNSIsInRhZyI6IiJ9"
                code_new_totp:
                  description: "Действующий код новой TOTP-сессии"
                  type: "string"
                  example: "123456"
            - required:
              - "cryptograms_fa"
              - "cryptogram_new_totp"
              - "code_new_totp"

  responses:
    200:
      description: "Успешный запрос"
      content:
        application/json:
          schema:
            allOf:
              - type: "object"
                properties:
                  user:
                    $ref: "../../index.yaml#/components/responses/id"
