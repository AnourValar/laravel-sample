allOf:
  - description: |
      Поля (light)
      <details>
        <summary>Структура полей</summary>

        **widget:fio**
        ```json
        {
          "data": {
            "first_name": "Иван",
            "last_name": "Иванов",
            "middle_name": "Иванович"
          },
          "options": null
        }
        ```

        **widget:date**
        ```json
        {
          "data": {
            "value": "2026-03-18"
          },
          "options": null
        }
        ```

        **widget:select**
        ```json
        {
          "data": {
            "value": "foo"
          },
          "options": {
            values: { // список значений
              "foo": {"title": "Опция 1"},
              "bar": {"title": "Опция 2"}
            }
          }
        }
        ```

        **widget:multi_select**
        ```json
        {
          "data": {
            "values": ["foo"]
          },
          "options": {
            values: { // список значений
              "foo": {"title": "Опция 1"},
              "bar": {"title": "Опция 2"}
            }
          }
        }
        ```

        **widget:regexp**
        ```json
        {
          "data": {
            "value": "1234"
          },
          "options": {
            "regexp": "/^[0-9]{4}$/" // регулярное выражение (значения)
          }
        }
        ```

        **widget:ru_inn**
        ```json
        {
          "data": {
            "value": "1234567890"
          },
          "options": null
        }
        ```

        **widget:ru_kpp**
        ```json
        {
          "data": {
            "value": "123456789"
          },
          "options": null
        }
        ```

        **widget:file**
        ```json
        {
          "data": null,
          "options": null
        }
        ```

        **widget:text**
        ```json
        {
          "data": {
            "value": "Hello world"
          },
          "options": {
            "min_length": 2,
            "max_length": 80
          }
        }
        ```

        **widget:integer**
        ```json
        {
          "data": {
            "value": 10
          },
          "options": {
            "min": 1,
            "max": 100
          }
        }
        ```
      </details>
    type: "object"
    properties:
      data:
        description: "Значение поле (см. структуру полей)"
        type:
          - "object"
          - "null"
        readOnly: false
        writeOnly: false
        example:
          value: "123456789"

      status:
        description: "Статус (см. /auth/state -> field_statuses)"
        type: "string"
        readOnly: false
        writeOnly: false
        example: "draft"

      created_at:
        description: "Дата добавления (ISO-8601)"
        type: "string"
        readOnly: true
        writeOnly: false
        example: "2024-07-20T11:21:00.000000Z"

      file_virtuals:
        description: "Файлы"
        type: "array"
        readOnly: true
        writeOnly: false
        items:
          $ref: "file_virtual_light.yaml"
