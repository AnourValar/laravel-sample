allOf:
  - description: "Токен пользователя (light)"
    type: "object"
    properties:
      id:
        description: "ID (уведомление)"
        type: "integer"
        readOnly: true
        writeOnly: false
        example: 1

      user_id:
        description: "Пользователь"
        type: "integer"
        readOnly: false
        writeOnly: true
        example: 2

      name:
        description: "Название девайса"
        type: "string"
        readOnly: false
        writeOnly: false
        example: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

      abilities:
        description: "Права (сущности)"
        type: "array"
        readOnly: false
        writeOnly: false
        items:
          type: "string"
          example: "*"

      ip_address:
        description: "IP адрес"
        type:
          - "string"
          - "null"
        readOnly: true
        writeOnly: false
        example: "127.0.0.1"

      geo_location:
        description: "GEO локация"
        type:
          - "string"
          - "null"
        readOnly: true
        writeOnly: false
        example: "Russia, Moscow"

      last_used_at:
        description: "Дата последнего использования (ISO-8601)"
        type:
          - "string"
          - "null"
        readOnly: true
        writeOnly: false
        example: "2024-07-20T11:21:00.000000Z"

      created_at:
        description: "Дата добавления (ISO-8601)"
        type: "string"
        readOnly: true
        writeOnly: false
        example: "2024-07-20T11:21:00.000000Z"
