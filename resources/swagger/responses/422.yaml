description: "Ошибка валидации входящих данных"
content:
  application/json:
    schema:
      type: "object"
      properties:
        message:
          description: "Техническое название"
          type: "string"
          example: "The given data was invalid."

        errors:
          description: "Ключи ошибок"
          type: "object"
          properties:
            email:
              type: "array"
              items:
                description: "Пользовательские сообщения"
                type: "string"
                example: "Поле email обязательно для заполнения."
            password:
              type: array
              items:
                description: "Пользовательские сообщения"
                type: "string"
                example: "Поле Пароль обязательно для заполнения."
